term: hallucination
forms: [hallucinations]
definition: 'Model output that is fluent and confident but false, such as a call to a function that does not exist, a citation to a paper that was never written, or a wrong fact. It follows from generating likely text instead of verified text. The response does not mark it. Supplying the facts an answer needs in the request, directly or retrieved from a knowledge base, makes it less likely. Checking the output catches the rest.'
